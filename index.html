<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мама, ты меня любишь?</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff4d6d 0%, #ff85a1 50%, #ffb3c6 100%);
    overflow: hidden;
    position: relative;
  }

  /* Плавающие сердечки на фоне */
  .heart-bg {
    position: absolute;
    color: rgba(255, 255, 255, 0.3);
    animation: floatUp linear infinite;
    pointer-events: none;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.5) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-20vh) scale(1.2) rotate(360deg);
      opacity: 0;
    }
  }

  /* Стеклянная карточка */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 32px;
    padding: 50px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(200, 0, 60, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes cardIn {
    from { transform: scale(0.8) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Большое пульсирующее сердце */
  .big-heart {
    font-size: 90px;
    line-height: 1;
    display: inline-block;
    animation: pulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 30, 90, 0.9));
    margin-bottom: 10px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  h1 {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    text-shadow: 0 2px 15px rgba(180, 0, 50, 0.6);
    margin-bottom: 30px;
    line-height: 1.35;
  }

  /* Кнопки */
  .buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 38px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .yes-btn {
    background: linear-gradient(135deg, #ff1744, #ff4d6d);
    color: #fff;
    box-shadow: 0 8px 25px rgba(255, 23, 68, 0.6);
  }

  .yes-btn:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 14px 35px rgba(255, 23, 68, 0.8);
  }

  .yes-btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  /* Экран с ответом */
  .answer {
    display: none;
    animation: answerIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .answer.show {
    display: block;
  }

  @keyframes answerIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  .smiley {
    font-size: 80px;
    display: inline-block;
    animation: wiggle 1s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.1); }
  }

  .answer h2 {
    color: #fff;
    font-size: 26px;
    margin-top: 15px;
    text-shadow: 0 2px 15px rgba(180, 0, 50, 0.6);
    line-height: 1.4;
  }

  .answer p {
    color: #fff;
    font-size: 18px;
    margin-top: 12px;
    opacity: 0.95;
    text-shadow: 0 2px 10px rgba(180, 0, 50, 0.5);
  }

  /* Взрыв сердечек */
  .burst-heart {
    position: fixed;
    font-size: 30px;
    pointer-events: none;
    z-index: 100;
    animation: burst 1.5s ease-out forwards;
  }

  @keyframes burst {
    0% {
      transform: translate(0, 0) scale(0.5) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    .card { padding: 40px 25px; }
    h1 { font-size: 23px; }
    .big-heart { font-size: 70px; }
    button { padding: 14px 30px; font-size: 16px; }
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <div id="question">
      <div class="big-heart">❤️</div>
      <h1>Мамочка,<br>а ты меня любишь?</h1>
      <div class="buttons">
        <button class="yes-btn" onclick="showLove()">Да, конечно! 💖</button>
      </div>
    </div>

    <div class="answer" id="answer">
      <div class="smiley">😍</div>
      <h2>И я тебя тоже очень сильно люблю!</h2>
      <p>Ты самая лучшая мама на свете! 💕</p>
    </div>
  </div>

<script>
  // Фоновые сердечки
  const hearts = ['❤️', '💖', '💕', '💗', '💓', '🌸'];
  function createBgHeart() {
    const h = document.createElement('div');
    h.className = 'heart-bg';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (Math.random() * 30 + 15) + 'px';
    h.style.animationDuration = (Math.random() * 8 + 7) + 's';
    h.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 17000);
  }
  setInterval(createBgHeart, 500);
  for (let i = 0; i < 8; i++) setTimeout(createBgHeart, i * 300);

  // "I love you" через Web Speech API
  function speakLove() {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance('I love you');
      u.lang = 'en-US';
      u.rate = 0.85;
      u.pitch = 1.2;
      u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const v = voices.find(x => /en[-_]?(US|GB)/i.test(x.lang) && /female|samantha|zira|google/i.test(x.name))
             || voices.find(x => /en/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  }

  // Взрыв сердечек
  function burst() {
    const emojis = ['❤️', '💖', '💕', '💗', '💓', '💝', '🌸', '✨'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 30; i++) {
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = cx + 'px';
      h.style.top = cy + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 350 + 100;
      h.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      h.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      h.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      h.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2000);
    }
  }

  function showLove() {
    document.getElementById('question').style.display = 'none';
    document.getElementById('answer').classList.add('show');
    speakLove();
    burst();
    // Повторный взрыв через паузу
    setTimeout(burst, 600);
  }

  // Предзагрузка голосов
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
</script>

</body>
</html>
